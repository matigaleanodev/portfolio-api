name: CI - Build, Push & Deploy API

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: deploy-portfolio-api
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: matigaleanodev/portfolio-api
  APP_NAME: portfolio-api

jobs:
  build-push-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: matigaleanodev
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & Push (sha + latest)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Deploy on EC2 through Systems Manager
        timeout-minutes: 10
        run: |
          set -Eeuo pipefail

          parameters=$(printf '{"commands":["sudo -u ec2-user /home/ec2-user/infra/scripts/deploy-app.sh %s sha-%s"]}' "$APP_NAME" "$GITHUB_SHA")
          command_id=$(aws ssm send-command \
            --region "${{ vars.AWS_REGION }}" \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "GitHub Actions deploy: $GITHUB_REPOSITORY@$GITHUB_SHA" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)

          status=Pending
          for _ in $(seq 1 60); do
            status=$(aws ssm get-command-invocation \
              --region "${{ vars.AWS_REGION }}" \
              --command-id "$command_id" \
              --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            case "$status" in
              Success|Cancelled|Failed|TimedOut)
                break
                ;;
            esac

            sleep 5
          done

          aws ssm get-command-invocation \
            --region "${{ vars.AWS_REGION }}" \
            --command-id "$command_id" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

          if [[ "$status" != "Success" ]]; then
            echo "Deployment failed with SSM status: $status" >&2
            exit 1
          fi

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Cleanup old images (keep last 3 sha tags)
        if: success()
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          OWNER: matigaleanodev
          PACKAGE: portfolio-api
          KEEP: 3
        run: |
          set -e

          versions=$(curl -s \
            -H "Authorization: Bearer $GHCR_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/$OWNER/packages/container/$PACKAGE/versions?per_page=100")

          ids_to_delete=$(echo "$versions" | jq -r '
            [ .[]
              | select(.metadata.container.tags != null)
              | select([.metadata.container.tags[] | startswith("sha-")] | any)
              | {id: .id, tags: .metadata.container.tags}
            ]
            | map(select(.tags | any(startswith("sha-"))))
            | .['"$KEEP"':]
            | .[].id
          ')

          if [ -z "$ids_to_delete" ]; then
            echo "No old sha images to delete."
            exit 0
          fi

          echo "$ids_to_delete" | while read -r id; do
            echo "Deleting version id=$id"
            curl -s -X DELETE \
              -H "Authorization: Bearer $GHCR_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/users/$OWNER/packages/container/$PACKAGE/versions/$id" \
              >/dev/null
          done
